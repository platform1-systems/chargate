name: Release

# Diatreme branch-based release workflow for platform1-systems.
#
# Environment flow:
#   1. Pull requests run Diatreme CI (image repos build a pr-<N> image).
#   2. Pushes to staging release rc prereleases.
#   3. Pushes to main release stable prod versions.
#
# Diatreme (v2.3.0+) auto-detects image_name from docker-bake.hcl, so no manual
# detection step is needed; a repo without a bake file runs versioning only. The
# versioning tool is auto-detected too (semantic-release-python for pyproject.toml
# [tool.semantic_release] repos), so it is not pinned here.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'
      - docs/**
      - mkdocs.yml
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diatreme:
    # Shares the repo's SELFHOSTED_GITHUB_RUNNER toggle (see security.yml):
    # set it to a self-hosted runner label to run releases on the cluster pool,
    # unset/blank to stay on GitHub-hosted.
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: PR image build
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: magmamoose/diatreme@0659f96503421d14269b30b1374b7da8aa4f5dd9 # v2.3.0
        with:
          mode: ci

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: magmamoose/diatreme@0659f96503421d14269b30b1374b7da8aa4f5dd9 # v2.3.0
        with:
          mode: release
          deployment-model: bbd
          branch-map: '{"staging": "staging", "main": "prod"}'
          environments: '["staging", "prod"]'
          prerelease-identifiers: '{"staging": "rc"}'
