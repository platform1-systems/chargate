name: Release

# Diatreme branch-based release workflow for platform1-systems.
#
# Environment flow:
#   1. Pull requests run Diatreme CI for image repositories.
#   2. Pushes to staging release rc prereleases.
#   3. Pushes to main release stable prod versions.
#
# Image repositories are detected from docker-bake.hcl only; the image name
# passed to Diatreme is derived from the first Bake tag, not the repo name.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'
      - docs/**
      - mkdocs.yml
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diatreme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          if [ ! -f docker-bake.hcl ]; then
            echo "image_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! bake_json="$(docker buildx bake -f docker-bake.hcl default --print)"; then
            echo "::error::failed to evaluate docker-bake.hcl 'default' target"
            exit 1
          fi
          first_tag="$(jq -r '[.target[]?.tags[]? | select(. != "")][0] // ""' <<< "$bake_json")"
          if [ -z "$first_tag" ]; then
            echo "::error::docker-bake.hcl does not define any target tags"
            exit 1
          fi

          # Diatreme wants the image name without registry or owner. Bake
          # remains the source of truth; this just adapts its first tag to
          # Diatreme's input shape.
          image_ref="${first_tag%%@*}"
          image_ref="${image_ref%:*}"
          image_path="${image_ref#*/}"
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          owner_prefix="${owner_lc}/"
          image_name="${image_path#"$owner_prefix"}"
          image_name="${image_name##*/}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: PR image build
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && steps.detect.outputs.image_name != ''
        uses: magmamoose/diatreme@f31adec7d62907cc81b9b880cd776e24fcdcbaf1 # v2.0.0
        with:
          mode: ci
          image_name: ${{ steps.detect.outputs.image_name }}

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: magmamoose/diatreme@f31adec7d62907cc81b9b880cd776e24fcdcbaf1 # v2.0.0
        with:
          mode: release
          deployment-model: bbd
          versioning-tool: gitversion
          branch-map: '{"staging": "staging", "main": "prod"}'
          environments: '["staging", "prod"]'
          prerelease-identifiers: '{"staging": "rc"}'
          image_name: ${{ steps.detect.outputs.image_name }}
