# Org Chargate security gate (MegaLinter-backed, net-new PR-diff gating), consumed
# as the Chargate MARKETPLACE ACTION. It gates on net-new findings on pull requests.
#
# Runs on `pull_request` only. The required `chargate` status check is produced on
# the PR, so merging to the default branch does NOT need a second whole-repo scan of
# already-gated code. Dropping the push trigger also stops every Diatreme release
# commit (version bumps/tags pushed to main + staging) from kicking off a fresh
# ~15-minute MegaLinter run — the single biggest GitHub Actions minute saver here.
# Trade-off: the default-branch baseline SARIF is no longer refreshed on the GitHub
# Security tab (which needs GHAS on private repos anyway); PR-time gating is retained.
#
# DefectDojo and Dependency-Track are intentionally not wired for platform1-systems.
name: Security

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
  # Chargate uses OIDC to request a short-lived Chargate App token for PR
  # comments. If the App is not installed, the action falls back to the
  # workflow GITHUB_TOKEN.
  id-token: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chargate:
    # Skip the whole-repo scan on Dependabot PRs. This org's Dependabot only bumps
    # pinned GitHub Actions SHAs, which effectively never introduce a net-new SARIF
    # finding, so a full MegaLinter run is wasted minutes. A skipped required check
    # still satisfies the ruleset, so Dependabot auto-merge is unaffected (Dependabot
    # PRs also run with a read-only token, degrading the comment/OIDC paths anyway).
    if: ${{ github.actor != 'dependabot[bot]' }}
    # Per-repo runner toggle, shared with the release (Diatreme) workflow.
    # Set the SELFHOSTED_GITHUB_RUNNER variable to a self-hosted runner label
    # (e.g. platform1-infra -> "prod-cpt-aws") to route this repo's managed
    # workflows to the cluster pool — free minutes and a warm MegaLinter image.
    # Leave it unset/blank to stay on GitHub-hosted; blanking it is also the
    # instant escape hatch if the self-hosted runners bomb out.
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: magmamoose/chargate@90725a6c6d3fc40c7114cad73d17829fc673e95f # v2.11.28
